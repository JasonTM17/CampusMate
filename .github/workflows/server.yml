name: server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart:
    runs-on: ubuntu-latest
    services:
      postgres_test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: campusmate_test
          POSTGRES_PASSWORD: campusmate_ci_database_password_not_secret
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campusmate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis_test:
        image: redis:6.2.6
        ports:
          - 9091:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.0

      - name: Pub get (workspace)
        run: dart pub get

      # config/passwords.yaml is machine-local by design (gitignored), so CI
      # regenerates it with the same test-only credentials as the services
      # above. Never place production secrets here.
      - name: Generate test passwords file
        run: |
          cat > server/config/passwords.yaml <<'EOF'
          test:
            database: 'campusmate_ci_database_password_not_secret'
            redis: 'campusmate_ci_redis_password_not_secret'
            emailSecretHashPepper: 'campusmate_ci_email_pepper_not_secret'
            jwtHmacSha512PrivateKey: 'campusmate_ci_jwt_hmac_key_not_secret'
            jwtRefreshTokenHashPepper: 'campusmate_ci_refresh_pepper_not_secret'
          EOF

      - name: Format check
        run: dart format --set-exit-if-changed server packages

      - name: Analyze
        run: |
          dart analyze server
          dart analyze packages/campusmate_client
          dart analyze packages/campusmate_shared

      - name: Test
        working-directory: server
        run: dart test
