name: campusmate_server
description: Serverpod backend for CampusMate.

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  serverpod: 3.4.13
  serverpod_client: 3.4.13
  serverpod_auth_idp_server: 3.4.13
  crypto: ^3.0.3
  campusmate_shared:
    path: ../packages/campusmate_shared

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.13
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations
