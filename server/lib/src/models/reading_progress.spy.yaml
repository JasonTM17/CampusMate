class: ReadingProgress
table: reading_progress
fields:
  userId: UuidValue
  bookId: int, relation(parent=books, onDelete=Cascade)
  progressPercent: double
  currentLocation: String
  updatedAt: DateTime
indexes:
  reading_progress_user_book_idx:
    fields: userId, bookId
    unique: true
  reading_progress_user_idx:
    fields: userId
