name: campusmate
description: "CampusMate — Study. Read. Grow."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  campusmate_client:
    path: ../../packages/campusmate_client
  serverpod_client: 3.4.13
  serverpod_flutter: 3.4.13
  serverpod_auth_idp_client: 3.4.13
  serverpod_auth_core_client: 3.4.13
  flutter_riverpod: ^3.0.0
  go_router: ^16.3.0
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  # Generated localizations are configured in l10n.yaml.
  generate: true

  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
